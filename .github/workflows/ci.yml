name: C++ CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [g++, clang++]
        exclude:
          - os: macos-latest
            compiler: g++

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup C++ Environment
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential
          fi

      - name: Check compiler version
        run: |
          ${{ matrix.compiler }} --version
          make --version

      - name: Build project
        run: |
          CXX=${{ matrix.compiler }} make clean all

      - name: Run tests
        run: |
          if [ -f "run_tests.sh" ]; then
            chmod +x run_tests.sh
            ./run_tests.sh
          else
            echo "No tests found"
          fi

      - name: Archive build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: task-manager-${{ matrix.os }}-${{ matrix.compiler }}
          path: task_manager
          retention-days: 7

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --error-exitcode=0 --inline-suppr \
            *.cpp *.h 2> cppcheck-report.txt || true
          cat cppcheck-report.txt

      - name: Check code formatting
        run: |
          clang-format --version
          echo "Checking code style..."
          find . -name '*.cpp' -o -name '*.h' | xargs clang-format -n -Werror || true

  release:
    name: Create Release
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build release
        run: make clean all

      - name: Generate release notes
        id: release_notes
        run: |
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "## Task Manager Release" >> $GITHUB_OUTPUT
          echo "Built on $(date)" >> $GITHUB_OUTPUT
          echo "Commit: ${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload release artifact
        uses: actions/upload-artifact@v3
        with:
          name: task-manager-release
          path: task_manager
